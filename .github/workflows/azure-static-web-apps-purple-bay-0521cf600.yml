name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Use Node.js version required by Angular CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: './static-web-app/package-lock.json'

      # Install Angular dependencies
      - name: Install dependencies
        working-directory: ./static-web-app
        run: npm ci

      # Build Angular application
      - name: Build Angular application
        working-directory: ./static-web-app
        run: npm run build

      # Deploy already-built Angular application
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BAY_0521CF600 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          # Angular project location
          app_location: "./static-web-app"

          # No API
          api_location: ""

          # Angular build output
          output_location: "dist/static-web-app/browser"

          # Do not build again using Azure/Oryx
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BAY_0521CF600 }}
          action: "close"
